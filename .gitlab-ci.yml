variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"
  GIT_STRATEGY: "clone"

stages:
  - frontend
  - backend
  - deploy

build-frontend:
  stage: frontend
  image: node:18-alpine
  cache:
    - key:
        files:
          - ./frontend/package-lock.json
      paths:
        - .npm/
        - node_modules/
        - .next/cache/
  before_script:
    - cd frontend
  script:
   - npm install
   - npm run build
  artifacts:
    paths:
     - "frontend/.next/*"
     - "frontend/out/*"

build-backend:
  stage: backend
  image: maven:3-eclipse-temurin-21-alpine
  cache:
    paths:
      - .m2/
  script:
    - mvn -B -DskipTests clean package -pl \!frontend
    - mv backend/target/*.jar .
  artifacts:
    paths:
    - "*.jar"

prod: 
  stage: deploy
  image: kroniak/ssh-client
  only:
    - main
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - >
     jarfile=$(ls *.jar)
    - >
     echo "jar file found: $jarfile"
    - >
     scp -o StrictHostKeyChecking=no $jarfile $USER@lbartner-01.media.fhstp.ac.at:~/$TARGETJARFILENAME
    - >
     ssh -o StrictHostKeyChecking=no $USER@lbartner-01.media.fhstp.ac.at "sudo /usr/bin/systemctl restart $TARGETSERVICENAME"
